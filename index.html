#splash em{position:absolute;left:0;right:0;bottom:calc(82px + env(safe-area-inset-bottom,0px));text-align:center;font:italic 400 17px/1 Georgia,"Times New Roman",serif;letter-spacing:.06em;color:rgba(255,255,255,.88);text-shadow:0 1px 12px rgba(0,0,0,.7)}
#splash.go{animation:splashOut .6s ease forwards}
#splash b{position:absolute;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));width:92px;height:2px;margin-left:-46px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
#splash b i{display:block;width:40%;height:100%;background:rgba(255,255,255,.85);border-radius:2px;animation:splashBar 1.1s ease-in-out infinite}
@keyframes splashBar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash b i{animation:none;width:100%}#splash.go{animation-duration:.01s}}
/* seek bars: filled track, per-style colours */
#app{--fill:rgb(var(--acc));--th:4px;--tw:14px;--psa:rgb(var(--acc))}
#app[data-ps=spotify]{--fill:#fff;--th:4px;--tw:12px;--psa:#ffb21f}
#app[data-ps=apple]{--fill:#fff;--th:7px;--tw:0px;--psa:#fff}
#app[data-ps=ytm]{--fill:#ff3d3d;--th:3px;--tw:12px;--psa:#fff}
#seek,#dSeek,#lySeek{-webkit-appearance:none;appearance:none;background:transparent;height:22px;cursor:pointer;accent-color:var(--fill)}
#seek::-webkit-slider-runnable-track,#dSeek::-webkit-slider-runnable-track,#lySeek::-webkit-slider-runnable-track{height:var(--th);border-radius:6px;background:linear-gradient(var(--fill),var(--fill)) 0/var(--p,0%) 100% no-repeat,rgba(255,255,255,.28)}
#seek::-webkit-slider-thumb,#dSeek::-webkit-slider-thumb,#lySeek::-webkit-slider-thumb{-webkit-appearance:none;width:var(--tw);height:var(--tw);margin-top:calc((var(--th) - var(--tw))/2);border-radius:50%;background:var(--fill);box-shadow:0 1px 4px rgba(0,0,0,.4)}
#seek::-moz-range-track,#dSeek::-moz-range-track,#lySeek::-moz-range-track{height:var(--th);border-radius:6px;background:rgba(255,255,255,.28)}
#seek::-moz-range-progress,#dSeek::-moz-range-progress,#lySeek::-moz-range-progress{height:var(--th);border-radius:6px;background:var(--fill)}
#seek::-moz-range-thumb,#dSeek::-moz-range-thumb,#lySeek::-moz-range-thumb{width:var(--tw);height:var(--tw);border:0;border-radius:50%;background:var(--fill)}
.ctl .ic.on{color:var(--psa)}.ctl .ic.on::after{background:var(--psa)}
/* Spotify */
[data-ps=spotify] .ctl .pb,[data-ps=spotify] .lyc .pb{background:#fff;box-shadow:none;width:66px;height:66px}
[data-ps=spotify] .ctl .pb svg,[data-ps=spotify] .lyc .pb svg{fill:#000}
[data-ps=spotify] .ctl>button:not(.ic) svg{filter:none}
/* Apple Music */
[data-ps=apple] .ctl .pb{background:none;box-shadow:none;width:88px;height:88px}
[data-ps=apple] .ctl .pb svg{width:50px;height:50px;fill:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.25))}
[data-ps=apple] .ctl>button:not(.ic){width:64px;height:64px}
[data-ps=apple] .ctl>button:not(.ic) svg{width:40px;height:40px}
[data-ps=apple] .ctl .ic{border-radius:13px;background:rgba(255,255,255,.16);width:42px;height:42px;opacity:1}
[data-ps=apple] .ctl .ic.on{background:#fff;color:#14110f}[data-ps=apple] .ctl .ic.on::after{display:none}
[data-ps=apple] .lyc .pb,[data-ps=apple] .dcn .pb,[data-ps=apple] #mini .pb{background:none;box-shadow:none}
[data-ps=apple] .lyc .pb svg{fill:#fff;width:34px;height:34px}[data-ps=apple] .dcn .pb svg,[data-ps=apple] #mini .pb svg{fill:var(--cream)}
/* YouTube Music */
[data-ps=ytm] .ctl .pb{background:#fff;width:80px;height:80px;box-shadow:0 4px 14px rgba(0,0,0,.35)}[data-ps=ytm] .ctl .pb svg{fill:#000;width:34px;height:34px}
[data-ps=ytm] .ctl .ic.on{opacity:1;color:#fff;background:rgba(255,255,255,.18)}[data-ps=ytm] .ctl .ic.on::after{display:none}
/* gestures */
#full,#mini,#lyr{touch-action:none}#lyL{touch-action:pan-y}main{touch-action:pan-y}
.flash{position:absolute;inset:0;display:grid;place-items:center;font:700 30px Figtree,system-ui,sans-serif;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.55);pointer-events:none;z-index:3;animation:flashUp .65s ease forwards}
@keyframes flashUp{0%{opacity:0;transform:scale(.8)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
/* now playing indicator */
.li>i{position:relative}
.eq{display:none;position:absolute;inset:0;border-radius:inherit;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center;gap:3px;padding-bottom:30%;text-decoration:none}
.eq s{display:block;width:3px;height:12px;background:#fff;border-radius:2px;transform-origin:bottom;text-decoration:none;animation:eqb .9s ease-in-out infinite}
.eq s:nth-child(2){animation-delay:.2s}.eq s:nth-child(3){animation-delay:.4s}
.li.on .eq{display:flex}
.tile .eq{inset:auto;top:12px;right:12px;width:30px;height:28px;border-radius:9px;padding-bottom:6px;background:rgba(0,0,0,.55);z-index:2}.tile.on .eq{display:flex}
@keyframes eqb{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
#app[data-pl="0"] .eq s{animation-play-state:paused}
.cd.now b,.li.now b{color:var(--amber)}
.cd.now>i{box-shadow:0 0 0 2px var(--amber)}
@media (prefers-reduced-motion:reduce){.eq s{animation:none;transform:scaleY(.7)}}
#lyH .pb{width:48px;height:48px}.lyc{gap:72px}
[data-ps=apple] #lyH .pb{background:rgba(255,255,255,.18);box-shadow:none}[data-ps=apple] #lyH .pb svg{fill:#fff}
/* text visibility */
#app{--atx:#8a5c1f}#app[data-theme=dark]{--atx:#e0b074}
.li.on b,.cd.now b,.li.now b,nav button.on{color:var(--atx)}
#app[data-hc="1"]{--cream:#000;--mute:#3a352e;--line:#bdb7ac}
#app[data-theme=dark][data-hc="1"]{--cream:#fff;--mute:#d6cfc2;--line:#5a544b}
#app[data-hc="1"] .li small,#app[data-hc="1"] .cd small,#app[data-hc="1"] .empty,#app[data-hc="1"] .top{font-weight:500}
#full,#lyr{--mute:rgba(255,255,255,.86);--card:rgba(255,255,255,.22)}
#app[data-hc="1"] #full,#app[data-hc="1"] #lyr{--mute:rgba(255,255,255,.96)}
#full h2,#full p,#full .tm,#full .fl,#full .cl,#lyr h2,#lyr p.ar,#lyr .cl,#lyr .tm{text-shadow:0 1px 8px rgba(0,0,0,.45)}
#full .sc{background:linear-gradient(rgba(0,0,0,calc(.22 + var(--lum,.4)*.3)),rgba(0,0,0,calc(.48 + var(--lum,.4)*.3)))}
#lyr .sc{background:linear-gradient(rgba(0,0,0,calc(.22 + var(--lum,.4)*.3)),rgba(0,0,0,calc(.4 + var(--lum,.4)*.3)) 55%,rgba(0,0,0,calc(.62 + var(--lum,.4)*.24)))}
#hd .sc{background:linear-gradient(rgba(0,0,0,calc(.24 + var(--lum,.4)*.3)),rgba(0,0,0,calc(.42 + var(--lum,.4)*.3)))}
#lyL p{color:rgba(255,255,255,.52);text-shadow:0 1px 10px rgba(0,0,0,.35)}
#lyL p.past{color:rgba(255,255,255,.44)}#lyL p.on{color:#fff}
#lyL p.none,#lyL.static p{color:rgba(255,255,255,.97)}
#app[data-hc="1"] #lyL p{color:rgba(255,255,255,.64)}#app[data-hc="1"] #lyL p.past{color:rgba(255,255,255,.56)}
.tile::before{background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.06) 72%)}
.tile b,.tile span{text-shadow:0 1px 8px rgba(0,0,0,.55)}.tile span{color:rgba(255,255,255,.92)}
.chip{text-shadow:0 1px 4px rgba(0,0,0,.35)}

/* home: now-playing hero */
.nph{position:relative;overflow:hidden;border-radius:22px;margin:0 0 24px;min-height:176px;background:#050505;border:1px solid rgba(255,255,255,.07);isolation:isolate}
.nph .npi{position:absolute;top:0;right:0;bottom:0;width:62%;background-size:cover;background-position:center 30%;z-index:-2;filter:saturate(1.05)}
.nph::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#050505 34%,rgba(5,5,5,.78) 52%,rgba(5,5,5,0) 100%),linear-gradient(0deg,rgba(5,5,5,.55),transparent 55%)}
.nph .npc{padding:20px 20px 18px;max-width:68%;display:flex;flex-direction:column;gap:8px;min-height:176px;justify-content:center}
.nph .npl{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:rgba(255,255,255,.72);letter-spacing:.02em}
.nph .npl i{width:16px;height:16px;border-radius:50%;background:var(--ac);display:grid;place-items:center;flex:none}
.nph .npl i svg{width:10px;height:10px;fill:none;stroke:#111;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.nph .npc .npt{margin:0;font-size:clamp(26px,7vw,34px);line-height:1.08;font-weight:800;letter-spacing:-.025em;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nph .npm{display:flex;align-items:center;gap:7px;font-size:13px;color:rgba(255,255,255,.7);min-width:0}
.nph .npm svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nph .npm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nph .npb{display:flex;align-items:center;gap:10px;margin-top:6px}
.nph .npp{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:#111;display:grid;place-items:center;cursor:pointer;flex:none}
.nph .npp svg{width:20px;height:20px;fill:currentColor}
.nph .npk{height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:#fff;font:600 13px/1 inherit;font-family:inherit;display:inline-flex;align-items:center;gap:6px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nph .npk svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nph .npk.on svg{fill:var(--ac);stroke:var(--ac)}
.nph .npk.on{border-color:var(--ac)}
@media (min-width:900px){.nph{min-height:230px}.nph .npc{min-height:230px;padding:30px 34px;max-width:56%;gap:10px}.nph .npc .npt{font-size:clamp(34px,3.6vw,54px)}.nph .npm{font-size:14px}.nph .npp{width:52px;height:52px}.nph .npi{width:58%}}
@media (max-width:420px){.nph .npc{max-width:74%;padding:16px}.nph .npk{padding:0 12px}}

/* ---------- mobile now-playing, phone portrait: UBayanda's mockup ----------
   Top card : big art, back button top-left, 4 round buttons top-right,
              song / artist / album + year bottom-left.
   Lower card: progress bar, small prev, BIG play, small next, lyrics handle.
   Everything is scoped to phone portrait; tablets / landscape keep their layouts.
   Colour tokens (--np*) are set once per theme so the cards follow light / dark. */
#fMore,#fMoreP{display:none}
@media (max-width:859px) and (max-aspect-ratio:11/10){
#app{--npb:#efede9;--npc:#121110;--npm:#6d675f;--npk:rgba(0,0,0,.08);--npg:rgba(0,0,0,.28);--npr:46px}

/* layout: art row, then the lower card (seek, times, controls, lyrics handle) */
#app #full{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto auto auto;align-content:stretch;row-gap:0;padding:0}
#app #full::after{content:"";grid-row:2/6;grid-column:1;z-index:0;background:var(--npb);border-radius:38px 38px 0 0;pointer-events:none}

#app #full .artw{grid-row:1;grid-column:1;position:relative;z-index:1;margin:0 0 10px;width:auto;height:auto;min-height:0;border-radius:0 0 38px 38px;overflow:hidden;flex:none}
#app #full .artb,#app #full #big{width:100%;height:100%;border-radius:0 0 38px 38px}
#app #full #big{box-shadow:none}
#app #full .hov,#app #full .f2,#app #full .fbig,#app #full #fCirc,#app #full #fSt,#app #full .fvol,#app #full .imclk,#app #full .fl,#app #full .exlogo{display:none!important}

/* title block over the bottom of the art */
#app #full .fcard{grid-row:1;grid-column:1;align-self:end;z-index:2;display:block;margin:0 0 10px;padding:90px 26px 26px;border-radius:0 0 38px 38px;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.62));pointer-events:none}
#app #full .fcard .ft{display:block;min-width:0}
#app #full .fcard h2{font-family:Figtree,system-ui,sans-serif;font-size:clamp(28px,9vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.04;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#fff!important;text-shadow:0 2px 14px rgba(0,0,0,.45)!important}
#app #full .fcard #fA{font-size:clamp(17px,5vw,21px);font-weight:600;margin-top:6px;color:rgba(255,255,255,.95)!important;text-shadow:0 1px 10px rgba(0,0,0,.45)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app #full .fcard #fM{font-size:15px;font-weight:500;margin-top:3px;color:rgba(255,255,255,.78)!important;text-shadow:0 1px 10px rgba(0,0,0,.45)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* top bar: back button + the 4 round buttons (Like, Queue, Sound, More) */
#app #full>.fh{position:absolute;inset:0;padding:0;pointer-events:none;z-index:6}
#app #full .fh>*,#app #full #fL,#app #full #snd{pointer-events:auto}
#app #full .fh .cl,#app #full #fQ,#app #full #fMore,#app #full #fL,#app #full #snd{display:flex;align-items:center;justify-content:center;position:absolute;width:var(--npr);height:var(--npr);padding:0;margin:0;border-radius:50%;border:0;color:#fff!important;background-color:var(--npg)!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:none}
#app #full .fh .cl{left:26px;top:calc(26px + env(safe-area-inset-top,0px))}
#app #full #fQ,#app #full #fL,#app #full #snd,#app #full #fMore{right:26px}
#app #full #fQ{top:calc(26px + env(safe-area-inset-top,0px))}
#app #full #fL{top:calc(84px + env(safe-area-inset-top,0px))}
#app #full #snd{top:calc(142px + env(safe-area-inset-top,0px))}
#app #full #fMore{top:calc(200px + env(safe-area-inset-top,0px))}
#app #full #fQ svg,#app #full #fL svg,#app #full #fMore svg{width:22px;height:22px}
#app #full #fMore svg{fill:#fff;stroke:none}
#app #full #fL.on{color:#ff5a6e!important}

/* More menu */

#app #full #fMoreP .ic,#app #full #fMoreP .chip{position:static;color:#f4f1ea!important;background:rgba(255,255,255,.1)!important;border:1px solid rgba(255,255,255,.16)!important;border-radius:999px;margin:0}
#app #full #fMoreP .ic{width:46px;height:46px;display:flex;align-items:center;justify-content:center;padding:0}

/* lower card */
#app #full #seek,#app #full .tm,#app #full .ctl,#app #full #lyPeek{position:relative;z-index:1;grid-column:1}
#app #full #seek{grid-row:2;margin:26px 34px 0;width:auto;height:28px;-webkit-appearance:none;appearance:none;background:transparent;--p:0%}
#app[data-theme] #full .fsheet #seek::-webkit-slider-runnable-track,#app #full .fsheet #seek::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(var(--npc),var(--npc)) 0/var(--p,0%) 100% no-repeat,var(--npk)!important}
#app #full #seek::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:50%;background:var(--npc);border:0;box-shadow:inset 0 0 0 8px var(--npc),inset 0 0 0 9px var(--npb)}

#app #full .tm{grid-row:3;display:flex;justify-content:space-between;margin:0 34px;font-size:12px;font-weight:600}

#app #full .ctl #prev,#app #full .ctl #next{width:62px;height:62px;background:var(--npk)!important;color:var(--npc)!important}
#app #full .ctl #prev svg,#app #full .ctl #next svg{width:26px;height:26px;fill:var(--npc)!important}
#app[data-theme] #full .fsheet .ctl .pb,#app #full .fsheet .ctl .pb{width:88px;height:88px;background:var(--npc)!important;color:var(--npb)!important}
#app #full .fsheet .ctl .pb svg{width:38px;height:38px;fill:var(--npb)!important}
#app #full #lyPeek{grid-row:5;position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;height:auto!important;padding:20px 24px calc(14px + env(safe-area-inset-bottom,0px))!important;margin:0;border-radius:0!important;background:transparent!important;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
#app #full #lyPeek .grab{width:76px;height:5px;border-radius:3px;background:var(--npc)!important;opacity:.85}
#app #full #lyPeek .pk{align-items:center;max-width:100%}
#app #full #lyPeek .pk span{display:none}
#app #full #lyPeek .pk b{font-size:12px;font-weight:500;color:var(--npm)!important;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app #full #lyPeek *{color:var(--npm)}
}

/* ---------- welcome / sign up / log in screens (inspired by a streaming-app welcome layout) ---------- */
#gate .gw{position:relative;width:100%;max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.gw-bub{position:absolute;left:-22px;right:-22px;top:0;height:58%;pointer-events:none;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}

/* ---------- performance: smooth screen changes, no see-through backdrop ---------- */
/* Tab changes used to fade every card in from fully transparent (black backdrop showed through for a moment)
   and animated EVERY row of long lists. Now: quick, shallow rise from 55% opacity, no stagger, rows beyond the first screenful don't animate. */
@keyframes vRise2{from{opacity:.55;transform:translateY(8px)}to{opacity:1;transform:none}}
#view.vin>*,#view.vin .list>*,#view.vin .pls>*,#view.vin .hubg>*,#view.vin .recent>*{animation-name:vRise2!important;animation-duration:.26s!important;animation-delay:0s!important;animation-timing-function:cubic-bezier(.2,.8,.2,1)!important}
#view.vin .list>*:nth-child(n+9),#view.vin .pls>*:nth-child(n+9),#view.vin .hubg>*:nth-child(n+9),#view.vin .recent>*:nth-child(n+9){animation:none!important}
/* long song lists: the browser skips layout and paint for rows that are off screen */
.list>.li,.list>.row2{content-visibility:auto;contain-intrinsic-size:auto 64px}
/* phones: no live backdrop blur on the always-visible pills / chips (the progress bar under them repaints every tick, which forced
   a re-blur every time) and no extra GPU layers for the hidden full-screen players. These were the biggest costs next to the audio. */
@media (max-width:859px){
 #app{--lgb:none}
 #app nav,#app #mini,#app #npill,#app .jmp,#app #toast,#app .mc-in,#app .qp,#app .hub,#app .rb2,#app .sxbox,#app .chip,#app #vhud,#app .nph .npk{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
 #app nav,#app #mini{background:rgba(24,22,20,.94)!important}
 #app[data-theme=light] nav,#app[data-theme=light] #mini{background:rgba(244,242,238,.96)!important}
 #full>.bl,#lyr>.bl{inset:-8%;filter:blur(22px) saturate(1.25)}
 #im>.bl{inset:-6%;filter:blur(28px) saturate(1.3)}
 #im:not(.open){visibility:hidden;transition:visibility 0s .7s}
 .bl{transition-duration:.45s}
}
@media (prefers-reduced-motion:reduce){#view.vin>*,#view.vin .list>*{animation:none!important}}
/* ---------- phones: the cards show the playing song's cover, softened ----------
   --cardart (js/65) is a 36px copy of the cover; stretched up it is soft without any blur filter, so it costs almost nothing.
   Every card uses the SAME scale of the cover (a full screen tall, like the tall Library card), so the softness is the same on every screen instead of squeezing the whole cover into short cards. A tint on top keeps text readable (light in light mode, dark in dark mode). The black canvas behind the cards is untouched. */
@media (max-width:859px){
#app{--cv:rgba(255,255,255,.42)}
#app[data-theme=dark]{--cv:rgba(10,9,8,.42)}
#app main#view .mcard{position:relative;isolation:isolate;background:var(--mc)}
#app main#view .mcard::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:color-mix(in srgb,rgb(var(--cc,120,110,100)) 30%,var(--mc))}
/* fallback (web covers the browser won't let us read): real image, live blur, visible cards only */
}

function act(k,x){

  else if(k==="npl"){S.pendList=(S.cidx||[]).slice();newPlM(null)}
  else if(k==="cop"){closeM();S.nav=decodeURIComponent(x);render();$("view").scrollTop=0}
  else if(k==="rmv"){closeM();removeSong(+x)}
  else if(k==="clr"){closeM();clearLibrary()}
  else if(k==="op"){try{window.open(T[+x].page,"_blank","noopener")}catch(e){}closeM()}
  else if(k==="el")elseM(+x);
  else if(k==="su")doSignUp();
  else if(k==="si")doSignIn();
  else if(k==="gsu")signUpM();
  else if(k==="gsi")signInM();
  else if(k==="avc"){const a=S.ed.av;S.ed.name=$("mi").value;S.ed.av=a.t==="emoji"?{...a,c:x}:{t:"color",c:x};editM()}
  else if(k==="ave"){S.ed.name=$("mi").value;S.ed.av={t:"emoji",e:x,c:S.ed.av.c||AVC[0]};editM()}
  else if(k==="avi"){S.ed.name=$("mi").value;S.ed.av={t:"color",c:S.ed.av.c||AVC[0]};editM()}
  else if(k==="edsave")edSave();
  else if(k==="delc"&&S.acct&&S.acct.cid){delAcct()}else if(k==="rmfc"){rmFriend(x)}else if(k==="dnap"){if(S.dnaIn){closeM();dnaPlay(S.dnaIn)}}else if(k==="delc"){const id=S.acct.id;S.accts=S.accts.filter(a=>a.id!==id);LS.set("milo.accts",S.accts);try{localStorage.removeItem("milo.v2."+id)}catch(e){}S.acct=null;LS.set("milo.cur","");closeM();toast("Account deleted");afterSwitch()}
  else if(k==="eq"){S.eq={n:x,...JSON.parse(JSON.stringify(PRESETS[x]))};S.eqOn=true;applyEQ();save();soundM()}
  else if(k==="eqt"){S.eqOn=!S.eqOn;applyEQ();save();soundM()}
  else if(k==="ps"){S.ps=x;save();setStyle();soundM()}
  else if(k==="mic")micToggle();
  else if(k==="lux")luxToggle();
  else if(k==="clauth")doCloudAuth(x)
  else if(k==="clsql")sqlCopy()
  else if(k==="auto"){S.auto=!S.auto;save();soundM()}
  else if(k==="minet"){S.miNet=S.miNet===false;save();soundM()}
  else if(k==="sb"){S.sb=S.sb===false;save();soundM()}
  else if(k==="smu"){closeM();window.open("https://simpmusic.org/app/watch?v="+encodeURIComponent(T[+x].yt),"_blank","noopener")}
  else if(k==="rad"){closeM();miRadio(+x)}
  else if(k==="shr"){closeM();shareTrack(+x)}else if(k==="shrc"){closeM();shareCard(+x)}else if(k==="off"){closeM();OFFB[T[+x].url]?dlDrop(+x):dlTrack(+x)}
  else if(k==="idle"){S.idle=!S.idle;save();soundM()}
  else if(k==="viz"){S.viz=!S.viz;save();vzKick();soundM()}
  else if(k==="amb"){S.amb=+x;save();ambApply();ambKick();soundM()}
  else if(k==="xf"){S.xf=+x;save();soundM()}
  else if(k==="gp"){S.gap=!S.gap;save();soundM()}
  else if(k==="fi"){closeM();findInfo(+x)}
  else if(k==="fl"){closeM();findLyrics(+x,true)}
  else if(k==="pn"){qIns(+x,true);toast("Playing next");closeM()}
  else if(k==="aq"){qIns(+x,false);toast("Added to queue");closeM()}
  else if(k==="ap")addPlM(+x);
  else if(k==="tp"){const [ii,id]=x.split(":"),p=S.pls.find(q=>q.id===id);if(p&&!p.keys.includes(T[+ii].key)){p.keys.push(T[+ii].key);rememberStream(+ii);save()}toast("Added to "+(p?p.name:"playlist"));closeM();render()}
  else if(k==="np")newPlM(+x);
  else if(k==="mk"){const inp=$("mi"),t=inp.dataset.t,p=mkPl(inp.value,t===""?null:+t),pend=S.pendList;S.pendList=null;if(pend)addKeys(p,pend);closeM();toast(`Created "${p.name}"`);render()}
  else if(k==="rn"){const p=S.pls.find(q=>q.id===x);if(p){p.name=$("mi").value.trim()||p.name;save()}closeM();render()}

  else if(k==="sp"){S.rate=+x;A.playbackRate=A.defaultPlaybackRate=S.rate;save();updCtl();msPos(true);closeM()}
  else if(k==="sl"){S.sleep=x==="0"?null:x==="end"?"end":Date.now()+ +x*60000;toast(x==="0"?"Sleep timer off":"Sleep timer set");updCtl();closeM()}
  else if(k==="qj"){S.qi=+x;start(S.q[S.qi]);closeM()}}

  if(k==="artist"){const o=artists().find(x=>x.id===id);return o?o.idx:[]}
  if(id==="liked")return likedIdx();const p=S.pls.find(x=>x.id===id);return p?plIdx(p):[]}
function collMenu(ref){const sr=decodeURIComponent(ref),c=sr.indexOf(":"),k=sr.slice(0,c),id=sr.slice(c+1),idx=collIdx(k,id);S.cidx=idx;
  const nm=k==="album"?(albums().find(x=>x.id===id)||{}).name:k==="artist"?(artists().find(x=>x.id===id)||{}).name:id==="liked"?"Liked songs":(S.pls.find(x=>x.id===id)||{}).name;
  const bg=k==="pl"?plArt(id,idx):idx.length?artOf(T[rep(idx)]):"var(--card)";
  modal(`<div class="mh"><i class="art" style="background:${bg}"></i><div><b>${esc(nm||"")}</b><br><small>${idx.length} song${idx.length===1?"":"s"}</small></div></div>
  <button class="mi" data-a="cpl:">Play</button><button class="mi" data-a="csh:">Shuffle</button><button class="mi" data-a="cpn:">Play next</button><button class="mi" data-a="cqu:">Add to queue</button><button class="mi" data-a="cap:">Add all to a playlist</button><button class="mi" data-a="cop:${ref}">Open</button>`)}
function qAddList(idx,nx){idx=(idx||[]).filter(i=>T[i]&&!T[i].ph);const n=idx.length,pl=n===1?"":"s";
  if(!n){toast("Nothing to add");return}
  if(S.cur<0){playList(idx,false);toast(`Playing ${n} song${pl}`);return}
  if(nx)S.q.splice(S.qi+1,0,...idx);else{S.q.push(...idx);idx.forEach(i=>{if(!S.base.includes(i))S.base.push(i)})}
  S.pre=null;toast(nx?`${n} song${pl} will play next`:`${n} song${pl} added to the queue`)}
function addKeys(p,idx){idx.forEach(i=>{const k=T[i].key;if(!p.keys.includes(k)){p.keys.push(k);rememberStream(i)}});save()}
function addListPlM(){modal(`<h3>Add all to playlist</h3>${S.pls.map(p=>`<button class="mi" data-a="tpl:${p.id}">${esc(p.name)}</button>`).join("")}<button class="mi" data-a="npl:">+ New playlist</button>`)}

const t0=performance.now();
function hideSplash(){const s=$("splash");if(!s)return;setTimeout(()=>{s.classList.add("go");setTimeout(()=>{if(s.parentNode)s.remove()},700)},Math.max(0,1200-(performance.now()-t0)))}
const isPwa=()=>!!document.querySelector('link[rel="manifest"]');
const isStandalone=()=>{try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}};

function installHtml(){
  const emb=top!==self,sec=location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1",
    ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1),
    h=(t,b)=>`<div class="row" style="margin-top:24px"><h2>Install milo.</h2></div><p class="empty" style="padding-top:0">${t}</p>${b||""}`;
  if(isStandalone())return `<div class="row" style="margin-top:24px"><h2>App</h2></div><p class="empty" style="padding-top:0">milo. is installed on this device.</p>`;
  if(emb)return h("This preview is shown inside another page, so it can't be installed from here. Download the app folder from the chat, put it on a web address (README.txt has the steps), then install from that address.");
  if(!sec)return h(location.protocol==="file:"?"This copy was opened straight from a file, and browsers only allow installing from a web address that starts with https. Upload the folder to Netlify Drop (free, about a minute), or run python3 -m http.server 8080 in the folder and open http://localhost:8080.":"Installing needs an https address, and this one isn't secure.");
  if(ipEvt)return h("Get a full-screen app with its own icon that starts even when you're offline.",'<button class="addb" data-inst>Install app</button>');
  if(ios)return h("On iPhone or iPad, open this address in Safari, tap Share, then Add to Home Screen.");
  return h("Open your browser's menu and choose Install app, or Add to Home screen. If you don't see it yet, reload the page once.")}

const G={sup:0};
document.addEventListener("click",e=>{if(Date.now()<G.sup){e.stopPropagation();e.preventDefault()}},true);
function buzz(n){try{navigator.vibrate&&navigator.vibrate(n||8)}catch(e){}}
function drag(el,o){let x0=0,y0=0,px=0,py=0,pt=0,vx=0,vy=0,ax=null,on=false;
  const reset=()=>{on=false;ax=null;if(o.cancel)o.cancel()};
  el.addEventListener("touchstart",e=>{if(e.touches.length!==1){on=false;return}
    if(o.skip&&e.target.closest&&e.target.closest(o.skip)){on=false;return}
    if(o.start&&!o.start(e)){on=false;return}
    const t=e.touches[0];on=true;ax=null;x0=px=t.clientX;y0=py=t.clientY;pt=Date.now();vx=vy=0},{passive:true});
  el.addEventListener("touchmove",e=>{if(!on)return;const t=e.touches[0],dx=t.clientX-x0,dy=t.clientY-y0,n=Date.now(),dt=Math.max(1,n-pt);
    vx=.75*vx+.25*((t.clientX-px)/dt);vy=.75*vy+.25*((t.clientY-py)/dt);px=t.clientX;py=t.clientY;pt=n;
    if(!ax){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;ax=Math.abs(dx)>Math.abs(dy)*1.2?"x":Math.abs(dy)>Math.abs(dx)*1.2?"y":null;if(!ax)return;
      if(o.axes&&!o.axes.includes(ax)){on=false;return}}
    if(o.move)o.move(dx,dy,ax,e)},{passive:true});
  el.addEventListener("touchend",e=>{if(!on)return;on=false;if(!ax)return;const t=e.changedTouches[0];G.sup=Date.now()+350;o.end&&o.end(t.clientX-x0,t.clientY-y0,vx,vy,ax)});
  el.addEventListener("touchcancel",reset)}
function artSwap(dir){const a=$("big"),W=innerWidth;buzz();
  a.style.transition="transform .18s ease-in,opacity .18s";a.style.transform=`translateX(${-dir*W*.7}px)`;a.style.opacity=0;
  setTimeout(()=>{dir>0?next(false):prev();a.style.transition="none";a.style.transform=`translateX(${dir*W*.5}px)`;
    requestAnimationFrame(()=>{a.style.transition="transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s";a.style.transform="";a.style.opacity=1;setTimeout(()=>{a.style.transition="";a.style.opacity=""},340)})},170)}

    else{m.style.transition="transform .25s cubic-bezier(.2,.8,.2,1)";m.style.transform="";setTimeout(()=>{m.style.transition=""},260);if(flick(dx,vx,70)){buzz();dx<0?next(false):prev()}}},

    else{const a=$("big");a.style.transition="none";a.style.transform=`translateX(${dx}px) rotate(${dx/55}deg)`;a.style.opacity=1-Math.min(.5,Math.abs(dx)/(innerWidth*1.2))}},
  end:(dx,dy,vx,vy,ax)=>{const f=$("full"),a=$("big");

/* ---------- everything that shows "now playing" updates the moment the song changes ---------- */
const recentIdx=()=>S.hist.map(idxOfKey).filter(i=>i>=0&&showable(i));
const recentHtml=rc=>rc.length?`<div class="recent r${rc.length}">${rc.map(tile).join("")}</div>`:'<p class="empty" style="margin-bottom:22px">Songs you play will show up here.</p>';
function pushHist(i){const t=T[i];if(!t||!t.key||t.ph)return;S.hist=[t.key,...S.hist.filter(x=>x!==t.key)].slice(0,80);save();updRecent()}
function updRecent(){
  if(S.nav==="recent:all"){const v=$("view"),y=v.scrollTop;render();v.scrollTop=y;return}
  if(S.tab==="Home"&&!S.nav){const c=$("recentBox");if(c){const rc=recentIdx().slice(0,3);S.lists.home=rc.slice();c.innerHTML=recentHtml(rc);bind();sync()}}}
function markNow(){const t=T[S.cur],refs=new Set();
  if(t){if(t.al&&!t.radio)refs.add("album:"+encodeURIComponent(t.al.toLowerCase()));
    new Set([...(t.a||"").split(/,\s*/),t.aa].filter(Boolean)).forEach(n=>refs.add("artist:"+encodeURIComponent(n.toLowerCase())));
    S.pls.forEach(p=>{if(p.keys.includes(t.key))refs.add("pl:"+encodeURIComponent(p.id))});if(S.likes.has(t.key))refs.add("pl:liked")}

const SQL_SETUP="-- milo. cloud sync: run once in Supabase > SQL editor\ncreate table if not exists public.milo_sync (\n  user_id uuid primary key default auth.uid() references auth.users(id) on delete cascade,\n  data jsonb not null default '{}'::jsonb,\n  updated_at timestamptz not null default now()\n);\nalter table public.milo_sync enable row level security;\ndrop policy if exists \"milo read own\" on public.milo_sync;\ndrop policy if exists \"milo insert own\" on public.milo_sync;\ndrop policy if exists \"milo update own\" on public.milo_sync;\ndrop policy if exists \"milo delete own\" on public.milo_sync;\ncreate policy \"milo read own\" on public.milo_sync for select using (auth.uid() = user_id);\ncreate policy \"milo insert own\" on public.milo_sync for insert with check (auth.uid() = user_id);\ncreate policy \"milo update own\" on public.milo_sync for update using (auth.uid() = user_id) with check (auth.uid() = user_id);\ncreate policy \"milo delete own\" on public.milo_sync for delete using (auth.uid() = user_id);\n\n-- ======================= milo. accounts, friends, sharing and chat =======================\n-- Run this whole file once in Supabase > SQL editor. Safe to run again.\n-- Tip: Authentication > Providers > Email > turn OFF \"Confirm email\" so people can start right after signing up.\n\ncreate table if not exists public.profiles (\n  id uuid primary key references auth.users(id) on delete cascade,\n  username text not null unique check (username ~ '^[a-z0-9_]{3,20}$'),\n  name text not null default '',\n  av jsonb not null default '{}'::jsonb check (pg_column_size(av) < 90000),\n  terms_v int not null default 0,\n  terms_at timestamptz,\n  share_pl boolean not null default true,\n  share_np boolean not null default true,\n  created_at timestamptz not null default now()\n);\n-- optional profile cover photo (used by miloCHAT)\nalter table public.profiles add column if not exists cover text check (cover is null or length(cover) < 70000);\nalter table public.profiles enable row level security;\ndrop policy if exists \"profiles read\" on public.profiles;\ndrop policy if exists \"profiles insert own\" on public.profiles;\ndrop policy if exists \"profiles update own\" on public.profiles;\ncreate policy \"profiles read\" on public.profiles for select to authenticated using (true);\ncreate policy \"profiles insert own\" on public.profiles for insert to authenticated with check (id = auth.uid());\ncreate policy \"profiles update own\" on public.profiles for update to authenticated using (id = auth.uid()) with check (id = auth.uid());\n\n-- create the profile automatically when someone signs up with a username\ncreate or replace function public.handle_new_user() returns trigger language plpgsql security definer set search_path = public as $$\ndeclare u text := lower(coalesce(new.raw_user_meta_data->>'username',''));\nbegin\n  if u ~ '^[a-z0-9_]{3,20}$' then\n    insert into public.profiles(id, username, name) values (new.id, u, coalesce(nullif(new.raw_user_meta_data->>'name',''), u));\n  end if;\n  return new;\nend $$;\ndrop trigger if exists on_auth_user_created on auth.users;\ncreate trigger on_auth_user_created after insert on auth.users for each row execute function public.handle_new_user();\n\ncreate or replace function public.username_free(u text) returns boolean language sql security definer set search_path = public as\n$$ select not exists (select 1 from public.profiles where username = lower(u)) $$;\ngrant execute on function public.username_free(text) to anon, authenticated;\n\ncreate or replace function public.find_user(u text) returns table(id uuid, username text, name text, av jsonb) language sql security definer set search_path = public as\n$$ select p.id, p.username, p.name, p.av from public.profiles p where p.username = lower(u) limit 1 $$;\ngrant execute on function public.find_user(text) to authenticated;\n\n-- friendships: a asks b; b accepts\ncreate table if not exists public.friendships (\n  a uuid not null references auth.users(id) on delete cascade,\n  b uuid not null references auth.users(id) on delete cascade,\n  status text not null default 'pending' check (status in ('pending','accepted')),\n  created_at timestamptz not null default now(),\n  primary key (a, b),\n  check (a <> b)\n);\ncreate unique index if not exists friendships_pair on public.friendships (least(a, b), greatest(a, b));\nalter table public.friendships enable row level security;\ndrop policy if exists \"fr read\" on public.friendships;\ndrop policy if exists \"fr ask\" on public.friendships;\ndrop policy if exists \"fr accept\" on public.friendships;\ndrop policy if exists \"fr delete\" on public.friendships;\ncreate policy \"fr read\" on public.friendships for select to authenticated using (auth.uid() in (a, b));\ncreate policy \"fr ask\" on public.friendships for insert to authenticated with check (a = auth.uid() and status = 'pending');\ncreate policy \"fr accept\" on public.friendships for update to authenticated using (b = auth.uid()) with check (b = auth.uid() and status = 'accepted');\ncreate policy \"fr delete\" on public.friendships for delete to authenticated using (auth.uid() in (a, b));\n\ncreate or replace function public.are_friends(x uuid, y uuid) returns boolean language sql stable security definer set search_path = public as\n$$ select exists (select 1 from public.friendships f where f.status = 'accepted' and ((f.a = x and f.b = y) or (f.a = y and f.b = x))) $$;\n\ncreate or replace function public.friend_cap() returns trigger language plpgsql security definer set search_path = public as $$\nbegin\n  if (select count(*) from public.friendships where a = new.a or b = new.a) >= 200 then raise exception 'friend_limit'; end if;\n  return new;\nend $$;\ndrop trigger if exists friend_cap_t on public.friendships;\ncreate trigger friend_cap_t before insert on public.friendships for each row execute function public.friend_cap();\n\n-- shared: now playing + playlists, stored as song DNA (metadata and a stream source, never audio files)\ncreate table if not exists public.shared (\n  user_id uuid primary key references auth.users(id) on delete cascade,\n  np jsonb, np_at timestamptz,\n  pl jsonb check (pl is null or pg_column_size(pl) < 400000), pl_at timestamptz\n);\nalter table public.shared enable row level security;\ndrop policy if exists \"shared read\" on public.shared;\ndrop policy if exists \"shared insert\" on public.shared;\ndrop policy if exists \"shared update\" on public.shared;\ndrop policy if exists \"shared delete\" on public.shared;\ncreate policy \"shared read\" on public.shared for select to authenticated using (user_id = auth.uid() or public.are_friends(auth.uid(), user_id));\ncreate policy \"shared insert\" on public.shared for insert to authenticated with check (user_id = auth.uid());\ncreate policy \"shared update\" on public.shared for update to authenticated using (user_id = auth.uid()) with check (user_id = auth.uid());\ncreate policy \"shared delete\" on public.shared for delete to authenticated using (user_id = auth.uid());\n\n-- messages: disappear after 24 hours, each chat holds 5 MB, oldest removed first\ncreate table if not exists public.messages (\n  id bigint generated always as identity primary key,\n  chat text not null,\n  sender uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  rcpt uuid not null references auth.users(id) on delete cascade,\n  kind text not null check (kind in ('text','song','img')),\n  body text not null,\n  bytes int not null default 0,\n  created_at timestamptz not null default now()\n);\ncreate index if not exists messages_chat_time on public.messages (chat, created_at desc);\ncreate index if not exists messages_rcpt_time on public.messages (rcpt, created_at desc);\n-- read receipts, replies, reactions and a short preview (so the chat list never downloads photos)\n-- voice notes (miloCHAT)\nalter table public.messages drop constraint if exists messages if;\n  if (select count(*) from public.messages where sender = new.sender and created_at > now() - interval '1 minute') >= 30 then raise exception 'rate_limited'; end if;\n  return new;\nend $$;\ndrop trigger if exists msg_before_t on public.messages;\ncreate trigger msg_before_t before insert on public.messages for each row execute function public.msg_before();\n\ncreate or replace function public.msg_after() returns trigger language plpgsql security definer set search_path = public as $$\nbegin\n  delete from public.messages where chat = new.chat and created_at < now() - interval '1 day';\n  delete from public.messages where id in (\n    select id from (select id, sum(bytes) over (order by created_at desc, id desc) as run from public.messages where chat = new.chat) s where s.run > 5242880);\n  return null;\nend $$;\ndrop trigger if exists msg_after_t on public.messages;\ncreate trigger msg_after_t after insert on public.messages for each row execute function public.msg_after();\n\n-- on update, only read_at (by the recipient, once) and your own reaction can change\ncreate or replace function public.msg_guard() returns trigger language plpgsql security definer set search_path = public as $$\nbegin\n  if auth.uid() is null then return new; end if; -- server-side edits (dashboard, service role) are not restricted\n  if new.id <> old.id or new.chat <> old.chat or new.sender <> old.sender or new.rcpt <> old.rcpt or new.kind <> old.kind or new.body <> old.body\n     or new.bytes <> old.bytes or new.created_at <> old.created_at or new.reply_to is distinct from old.reply_to then raise exception 'message_locked'; end if;\n  if new.read_at is distinct from old.read_at then\n    if auth.uid() is distinct from old.rcpt or old.read_at is not null then new.read_at := old.read_at; end if;\n  end if;\n  if new.rx is distinct from old.rx then\n    if pg_column_size(new.rx) > 1500 then raise exception 'rx_too_large'; end if;\n    if (new.rx - coalesce(auth.uid()::text, '')) <> (old.rx - coalesce(auth.uid()::text, '')) then raise exception 'rx_locked'; end if;\n  end if;\n  return new;\nend $$;\ndrop trigger if exists msg_guard_t on public.messages;\ncreate trigger msg_guard_t before update on public.messages for each row execute function public.msg_guard();\n\n-- live updates (instant messages, friend requests, sync between devices)\ndo $$ declare t text; begin\n  foreach t in array array['messages','friendships','shared','milo_sync'] loop\n    begin execute format('alter publication supabase_realtime add table public.%I', t);\n    exception when duplicate_object then null; when undefined_object then null; end;\n  end loop;\nend $$;\n\n-- removing a friend deletes the chat\ncreate or replace function public.fr_gone() returns trigger language plpgsql security definer set search_path = public as $$\nbegin\n  delete from public.messages where chat = least(old.a::text, old.b::text) || ':' || greatest(old.a::text, old.b::text);\n  return old;\nend $$;\ndrop trigger if exists fr_gone_t on public.friendships;\ncreate trigger fr_gone_t after delete on public.friendships for each row execute function public.fr_gone();\n\n-- delete my account and everything under it\ncreate or replace function public.delete_me() returns void language plpgsql security definer set search_path = public, auth as $$\nbegin\n  delete from auth.users where id = auth.uid();\nend $$;\ngrant execute on function public.delete_me() to authenticated;\n\n-- push notifications (new messages and friend requests while the app is closed)\ncreate table if not exists public.push_subs (\n  id bigint generated always as identity primary key,\n  user_id uuid not null references auth.users(id) on delete cascade,\n  kind text not null check (kind in ('web','fcm')),\n  endpoint text not null unique,\n  keys jsonb,\n  created_at timestamptz not null default now()\n);\ncreate index if not exists push_subs_user on public.push_subs (user_id);\nalter table public.push_subs enable row level security;
