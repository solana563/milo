name: Build milo. native APK
on:
  workflow_dispatch:
  push:
    paths: ["milo-native/**", ".github/workflows/native.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      FB_APP: ${{ secrets.FIREBASE_APP_ID }}
    defaults: { run: { working-directory: milo-native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: milo-native-debug-apk
          path: milo-native/app/build/outputs/apk/debug/*.apk
      # Optional: same Firebase App Distribution step as the web-wrapper APK (needs FIREBASE_APP_ID + FIREBASE_SERVICE_ACCOUNT secrets).
      - name: Firebase App Distribution
        if: ${{ env.FB_APP != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: milo-native/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: "milo. native debug build"
