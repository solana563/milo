name: Build milo. native APK
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Firebase tester track for this run (none = build only)"
        type: choice
        default: none
        options: [none, internal, beta, rc]
  pull_request:
    paths: ["milo-native/**", ".github/workflows/native.yml", ".github/scripts/**"]
  push:
    branches: ["**"]
    paths: ["milo-native/**", ".github/workflows/native.yml", ".github/scripts/**"]
    tags: ["v*"]
# Pull requests and ordinary branches: build and test only. Firebase distribution runs for pushes to main (internal testers),
# version tags v* (beta, or release-candidate when the tag contains "-rc") and a manual run that picks a track.
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.tests.outcome }}
      rel: ${{ steps.rel.outcome }}
    env:
      KS_B64: ${{ secrets.MILO_KEYSTORE_B64 }}
      MILO_KEYSTORE_PASSWORD: ${{ secrets.MILO_KEYSTORE_PASSWORD }}
      MILO_KEY_ALIAS: ${{ secrets.MILO_KEY_ALIAS }}
      MILO_KEY_PASSWORD: ${{ secrets.MILO_KEY_PASSWORD }}
      MILO_VERSION_CODE: ${{ github.run_number }}
    defaults: { run: { working-directory: milo-native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Version name (tag v1.2.3 gives 1.2.3, otherwise 1.0)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="1.0"; fi
          echo "MILO_VERSION_NAME=$V" >> "$GITHUB_ENV"
      - name: Release signing key (only when the MILO_KEYSTORE_B64 secret is set)
        shell: bash
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/milo.jks"; echo "MILO_KEYSTORE_FILE=$RUNNER_TEMP/milo.jks" >> "$GITHUB_ENV"; echo "Release key found."; else echo "No release key: builds use the debug key."; fi
      - name: Firebase config (only when the GOOGLE_SERVICES_JSON secret is set)
        shell: bash
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > app/google-services.json; echo "Firebase push is enabled for this build."; else echo "No GOOGLE_SERVICES_JSON secret: push stays off, everything else is unchanged."; fi
      - name: Unit tests
        id: tests
        continue-on-error: true   # lets the artifacts below still build and upload; the "Release gate" step at the end fails the run if this failed
        run: gradle testFullDebugUnitTest --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milo-native-test-reports
          path: milo-native/app/build/reports/tests/
          if-no-files-found: ignore
      - run: gradle assembleFullDebug --stacktrace
      - name: Print the signing fingerprints (for Google sign-in)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          KT="$JAVA_HOME/bin/keytool"; [ -x "$KT" ] || KT=keytool
          sha() { "$KT" -list -v "$@" 2>&1 | grep -iE "SHA-?1:" | head -1 | sed 's/^ *//'; }
          DBG=""
          for f in "$ANDROID_USER_HOME/debug.keystore" "$HOME/.android/debug.keystore" /root/.android/debug.keystore; do [ -f "$f" ] && DBG="$f" && break; done
          [ -z "$DBG" ] && DBG=$(find / -name debug.keystore -not -path "*/proc/*" 2>/dev/null | head -1)
          {
            echo "## Signing fingerprints for Google Cloud (Android OAuth client)"
            echo "Package name: com.ubayanda.milonative"
            echo
            echo "Debug key (debug APK): $(sha -keystore "$DBG" -alias androiddebugkey -storepass android)"
            if [ -n "$MILO_KEYSTORE_FILE" ]; then
              echo
              echo "Release key (release APK / AAB): $(sha -keystore "$MILO_KEYSTORE_FILE" -alias "$MILO_KEY_ALIAS" -storepass "$MILO_KEYSTORE_PASSWORD")"
            else
              echo
              echo "No release key in this run."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Build smooth release APK (minified, much faster scrolling)
        id: rel
        continue-on-error: true
        run: gradle assembleFullRelease --stacktrace 2>&1 | tee release-build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Play Store bundle (.aab)
        id: aab
        continue-on-error: true
        run: gradle bundleFullRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: milo-native-release-aab
          path: milo-native/app/build/outputs/bundle/fullRelease/*.aab
          if-no-files-found: ignore
      - name: F-Droid flavour compiles (no Google libraries)
        id: fdroid
        continue-on-error: true
        run: gradle assembleFdroidRelease --stacktrace
      - name: Upload the release build log when the release build failed
        if: steps.rel.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: milo-native-RELEASE-FAILED-log
          path: milo-native/release-build.log
      - uses: actions/upload-artifact@v4
        if: steps.rel.outcome == 'success'
        with:
          name: milo-native-release-apk
          path: milo-native/app/build/outputs/apk/full/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: milo-native-debug-apk
          path: milo-native/app/build/outputs/apk/full/debug/*.apk
      # Never report a release as ready just because Gradle finished: check the files themselves.
      - name: Release gate (artifact checks)
        if: always()
        shell: bash
        env:
          T_TESTS: ${{ steps.tests.outcome }}
          T_REL: ${{ steps.rel.outcome }}
          T_AAB: ${{ steps.aab.outcome }}
          T_FDROID: ${{ steps.fdroid.outcome }}
        run: |
          set +e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          FAIL=0
          row() { echo "| $1 | $2 | $3 |" | tee -a "$GITHUB_STEP_SUMMARY"; }
          {
            echo "## Release gate"
            echo "| Check | Result | Detail |"
            echo "|---|---|---|"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          row "Unit tests" "$T_TESTS" "failures block the gate"
          [ "$T_TESTS" = "success" ] || FAIL=1
          row "Release APK build" "$T_REL" "skipped or failed = not a release candidate"
          row "AAB build" "$T_AAB" ""
          row "F-Droid flavour" "$T_FDROID" ""
          check_apk() {
            f="$1"; label="$2"; need="$3"
            if [ ! -s "$f" ]; then row "$label exists" "MISSING" "$f"; [ "$need" = "yes" ] && FAIL=1; return; fi
            row "$label exists" "ok" "$(du -h "$f" | cut -f1)"
            pkg=$("$BT/aapt2" dump badging "$f" 2>/dev/null | sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)'.*/\1 code \2/p")
            row "$label package" "${pkg:-unreadable}" "expect com.ubayanda.milonative, code > 0"
            case "$pkg" in com.ubayanda.milonative*"code "[1-9]*) ;; *) FAIL=1;; esac
            sig=$("$BT/apksigner" verify --print-certs "$f" 2>&1)
            if echo "$sig" | grep -q "Verified using\|DOES NOT VERIFY"; then :; fi
            if "$BT/apksigner" verify "$f" >/dev/null 2>&1; then row "$label signature" "valid" "$(echo "$sig" | grep -i 'SHA-256 digest' | head -1)"; else row "$label signature" "INVALID" ""; FAIL=1; fi
            if echo "$sig" | grep -qi "Android Debug"; then row "$label signed with" "DEBUG key" "fine for testing, not for release"; fi
          }
          check_apk app/build/outputs/apk/full/debug/app-full-debug.apk "Debug APK" yes
          REL=$(ls app/build/outputs/apk/full/release/*.apk 2>/dev/null | head -1)
          check_apk "${REL:-none}" "Release APK" no
          AAB=$(ls app/build/outputs/bundle/fullRelease/*.aab 2>/dev/null | head -1)
          if [ -s "${AAB:-none}" ]; then row "AAB exists" "ok" "$(du -h "$AAB" | cut -f1)"; else row "AAB exists" "MISSING" ""; fi
          if [ -f app/google-services.json ]; then row "Firebase push config" "present" "full app can register for push"; else row "Firebase push config" "absent" "push is off in this build"; fi
          if [ -n "$KS_B64" ]; then row "Release key configured" "yes" ""; else row "Release key configured" "NO" "release builds use the debug key"; fi
          if [ "$FAIL" = "1" ]; then echo "Release gate FAILED" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
          echo "Release gate passed (distribution steps are separate and only run when their secrets are set)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Distribution decision
        if: always()
        shell: bash
        env:
          T_TESTS: ${{ steps.tests.outcome }}
          T_REL: ${{ steps.rel.outcome }}
        run: |
          {
            echo "### Firebase distribution"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then echo "Not distributed: pull requests only build and test."
            elif [ "$T_TESTS" != "success" ]; then echo "Not distributed: unit tests did not pass ($T_TESTS)."
            elif [ "$T_REL" != "success" ]; then echo "Not distributed: the release APK did not build ($T_REL)."
            elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" != "refs/heads/main" ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then echo "Not distributed: branch builds are build-and-test only (distribution runs for main and v* tags)."
            elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.track }}" = "none" ]; then echo "Not distributed: the manual run chose track 'none'."
            else echo "Eligible: see the 'distribute' job for the result."; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  distribute:
    needs: apk
    if: >-
      needs.apk.outputs.tests == 'success' && needs.apk.outputs.rel == 'success' &&
      github.event_name != 'pull_request' &&
      ((github.event_name == 'workflow_dispatch' && inputs.track != 'none') ||
       (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          name: milo-native-release-apk
          path: release-apk
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Track and tester groups
        id: track
        shell: bash
        env:
          INPUT_TRACK: ${{ inputs.track }}
          G_INTERNAL: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          G_BETA: ${{ secrets.FIREBASE_BETA_GROUPS }}
          G_RC: ${{ secrets.FIREBASE_RC_GROUPS }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) T="$INPUT_TRACK" ;;
            *) if [[ "$GITHUB_REF" == refs/tags/v* ]]; then case "$GITHUB_REF_NAME" in *-rc*) T=rc ;; *) T=beta ;; esac; else T=internal; fi ;;
          esac
          case "$T" in internal) G="$G_INTERNAL" ;; beta) G="$G_BETA" ;; rc) G="$G_RC" ;; *) G="" ;; esac
          echo "track=$T" >> "$GITHUB_OUTPUT"
          echo "groups=$G" >> "$GITHUB_OUTPUT"
      - name: Release notes
        shell: bash
        env:
          LABEL: Full release
          TRACK: ${{ steps.track.outputs.track }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TESTS_OUTCOME: ${{ needs.apk.outputs.tests }}
          TEST_TASK: testFullDebugUnitTest
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          B=$("$BT/aapt2" dump badging release-apk/*.apk | sed -n "s/^package: name='[^']*' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1|\2/p")
          export VERSION_CODE="${B%%|*}" VERSION_NAME="${B##*|}"
          bash .github/scripts/fb-release-notes.sh "$RUNNER_TEMP/release-notes.txt"
      - name: Upload to Firebase App Distribution
        shell: bash
        env:
          APK_DIR: release-apk
          EXPECT_PKG: com.ubayanda.milonative
          LABEL: milo. Full
          TRACK: ${{ steps.track.outputs.track }}
          FB_APP: ${{ secrets.FIREBASE_APP_ID }}
          FB_GROUPS: ${{ steps.track.outputs.groups }}
          FB_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.txt
        run: bash .github/scripts/fb-distribute.sh
      - name: Remove any leftover credential files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/fbsa.* "$RUNNER_TEMP"/fb.* 2>/dev/null || true
