name: Build Desktop (Windows)
on:
  workflow_dispatch:
  push:
    paths: ["desktop/**", "index.html", "src/**", "sw.js", "manifest.webmanifest", "icons/**", ".github/workflows/desktop.yml"]
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: milo-desktop-windows
          path: |
            desktop/dist/*.exe
